name: orizn-visa
description: "Visa and entry requirements for any passport/destination pair, in 15 languages. Entry rules, documents, fees, processing times, transit visas, vaccinations and overstay penalties. Live coverage counts via get_coverage_stats."
category: Travel
tags:
  - visa
  - travel
  - passport
  - immigration
  - multilingual
  - country-data
icon: "🌍"
startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: "Optional Orizn Visa API key. Leave empty to try the server keyless: quick_visa_check answers 10 pairs/day with no account. A key lifts that cap and unlocks documents, fees, processing times, transit rules and 15 languages. Free key (100 requests/month, no credit card) at https://visa.orizn.app/visa-api"
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "orizn-visa-mcp"],
      env: config.apiKey ? { ORIZN_API_KEY: config.apiKey } : {}
    })
